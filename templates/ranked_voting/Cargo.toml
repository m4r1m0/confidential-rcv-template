[package]
name = "ranked_voting"
version = "0.1.0"
edition = "2024"
description = "Confidential ranked-choice voting template for Tari Ootle (IRV, stealth ballots, unlinkable voters)"

[dependencies]
tari_template_lib = { version = "0.31" }
# The pure tally algorithms live in a standalone crate so the template can ship as a pure
# cdylib: with a second crate-type (rlib) present, rustc silently drops `-C lto` and the
# WASM grows ~20%. Tests link `rcv-tally` directly instead of this crate.
rcv-tally = { path = "../../tally" }

[dev-dependencies]
tari_template_test_tooling = "0.39"

[lib]
crate-type = ["cdylib"]
