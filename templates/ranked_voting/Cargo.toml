[package]
name = "ranked_voting"
version = "0.1.0"
edition = "2024"
description = "Confidential ranked-choice voting template for Tari Ootle (IRV, stealth ballots, unlinkable voters)"

[dependencies]
tari_template_lib = { version = "0.29" }

[dev-dependencies]
tari_template_test_tooling = "0.38"

# Compile-time selection of the tally algorithms included in the WASM. The default build
# ships everything; publishers who want a smaller, cheaper template can build with
# `--no-default-features` and enable only the methods they need:
#   --no-default-features                     single-winner IRV only
#   --no-default-features --features stv      IRV + STV
#   --no-default-features --features sequential-irv   IRV + sequential IRV
# The multi-winner method is still pinned per contract via `MultiWinnerMethod` in `new()`.
[features]
default = ["sequential-irv", "stv"]
sequential-irv = []
stv = []

[lib]
crate-type = ["cdylib", "rlib"]
