[package]
name = "integration"
version = "0.1.0"
edition = "2024"

[dependencies]
ootle-rs = "0.18"
tari_ootle_transaction = "0.38"
tari_template_lib = "0.29"
tari_template_lib_types = "0.29"
ootle_byte_type = "0.10"
indexmap = "2"
tari_crypto = "0.23"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hex = "0.4"
# The tally crate defines `MultiWinnerMethod` (the template re-exports it); the client needs
# the host-side type to construct the `new` arguments.
rcv-tally = { path = "../../tally" }
