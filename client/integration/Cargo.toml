[package]
name = "integration"
version = "0.1.0"
edition = "2024"

[dependencies]
ootle-rs = "0.18"
tari_ootle_transaction = "0.38"
tari_template_lib = "0.29"
tari_template_lib_types = "0.29"
ootle_byte_type = "0.10"
indexmap = "2"
tari_crypto = "0.23"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hex = "0.4"
# The template crate exposes `MultiWinnerMethod` (and the other ABI types) on the host build,
# which the client needs to construct the `new` arguments.
ranked_voting = { path = "../../templates/ranked_voting" }
